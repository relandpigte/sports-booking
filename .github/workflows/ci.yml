name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bunal
          POSTGRES_PASSWORD: bunal-check
          POSTGRES_DB: bunal_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bunal -d bunal_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bunal:bunal-check@localhost:5432/bunal_check?schema=public
      AUTH_SECRET: ci-auth-secret-that-is-not-used-in-production
      ENCRYPTION_KEY: ci:Q0lDSUNJQ0lDSUNJQ0lDSUNJQ0lDSUNJQ0lDSUNJQ0k=
      APP_URL: http://localhost:3000
      BOOKING_SWEEP_SECRET: ci-sweep-secret
      PARTNER_MFA_REQUIRED_AFTER: "2000-01-01T00:00:00.000Z"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:push
      - run: npm run lint
      - run: npm run build
      - run: npm run check
