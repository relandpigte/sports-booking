<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10243a" />
    <title>Offline — Bunal.club</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7faf8;
        color: #14202c;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 32px 24px;
        border: 1px solid #dfe7e2;
        border-radius: 24px;
        background: #fff;
        text-align: center;
        box-shadow: 0 12px 36px rgba(16, 36, 58, 0.08);
      }
      img { width: 88px; height: 88px; }
      h1 { margin: 20px 0 0; color: #10243a; font-size: 28px; }
      p { margin: 12px auto 0; max-width: 320px; color: #64748b; line-height: 1.6; }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        padding: 0 20px;
        border-radius: 12px;
        background: #16803c;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.png" alt="" />
      <h1>You&apos;re offline</h1>
      <p>
        Live court availability and booking changes need a connection. Reconnect,
        then try again.
      </p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
